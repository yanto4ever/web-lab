<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Галерея</title>
    <style>
        :root {
            --h2-size: 1.5em;
        }
        h1 {
            text-align: center;
            font-size: 20px;
        }
        a[href="index.html"] {
            font-style: italic;
        }
        h2 {
            text-align: center;
            font-size: var(--h2-size);
        }
        h3:nth-of-type(1) {
            text-align: center;
            font-size: calc(var(--h2-size) * 0.7);
        }
        h3:nth-of-type(2) {
            text-align: center;
            font-size: calc(var(--h2-size) * 1.3);
        }
        h3:nth-of-type(3) {
            text-align: center;
            font-size: calc(var(--h2-size) * 1.69);
        }
        img {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h1>Галерея Крупчин Владислав Михайлович</h1>
    <a href="index.html">Назад на головну</a>
    <h2>Мої зображення</h2>
    <h3>Зображення у цій папці</h3>
    <img src="img1.svg" alt="Зображення 640x480 з кореневої папки" width="640" height="480">

    <h3>Зображення у папці</h3>
    <img src="images/img2.svg" alt="Зображення 640x480 з папки images" width="640" height="480">

    <h3>Зображення онлайн</h3>
    <img src="https://placehold.co/1280x1024.png" alt="Зображення 1280x1024 онлайн" width="1280" height="1024">
</body>
</html>
